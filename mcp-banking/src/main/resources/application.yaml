server:
  port: 8091

spring:
  application:
    name: mcp-banking
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${FINSENTINEL_ISSUER:http://localhost:8094/realms/finsentinel}
          audiences: [mcp-banking]
  ai:
    mcp:
      server:
        name: finsentinel-banking
        version: 0.1.0
        # Read-only lookups with no conversation state: any instance can answer any request.
        protocol: STATELESS
        instructions: Read-only access to the bank's CRM and core banking records.

finsentinel:
  banking:
    crm-url: http://localhost:8093/crm
    core-url: http://localhost:8093/core
    connect-timeout: 2s
    read-timeout: 5s

management:
  tracing:
    sampling:
      # Parent-based: requests from the platform keep its decision.
      probability: 1.0
  # Traces are exported only when an OTLP endpoint is set:
  #   --management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
  otlp:
    metrics:
      export:
        # Off unless a collector is configured: it would log a failed push every minute.
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
