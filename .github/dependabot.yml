# Weekly update pull requests (ADR 0022). Minor and patch updates come grouped per ecosystem, one PR to review; major
# updates come one by one, since they are decisions (CLAUDE.md: after a Spring AI or Spring AI Alibaba upgrade, run the
# full suite and a packaged-jar case). CI runs every check on each PR.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Stays at the version Spring Boot manages (CLAUDE.md, root pom.xml): it moves with the Boot upgrade, never alone.
      - dependency-name: "io.opentelemetry:*"
    groups:
      # Versions chosen to match a framework rather than the newest release: Jackson 3, JUnit and Kafka follow Spring
      # Boot, log4j and Jackson 2 follow Spark, the MCP SDK follows Spring AI, and Flink waits for a matching
      # flink-connector-kafka (ADR 0022 "Upgrades"). Their own PR, so a decision does not hold back the safe updates;
      # the SBOM scan still fails on any of them with a known vulnerability.
      maven-framework-aligned:
        patterns:
          - "tools.jackson*"
          - "com.fasterxml.jackson*"
          - "org.junit*"
          - "org.apache.kafka*"
          - "org.apache.logging.log4j*"
          - "io.modelcontextprotocol*"
          - "org.apache.flink*"
          - "org.apache.spark*"
        update-types: [minor, patch]
      # Everything else. The exclusions are needed: Dependabot does not take the first matching group, it judged this
      # catch-all "more specific" and put every dependency in it (seen in the update job's log, 2026-10-16).
      maven-minor-and-patch:
        exclude-patterns:
          - "tools.jackson*"
          - "com.fasterxml.jackson*"
          - "org.junit*"
          - "org.apache.kafka*"
          - "org.apache.logging.log4j*"
          - "io.modelcontextprotocol*"
          - "org.apache.flink*"
          - "org.apache.spark*"
        update-types: [minor, patch]

  # Also keeps the commit SHAs in the workflows current, with the version in the trailing comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
    groups:
      images-minor-and-patch:
        update-types: [minor, patch]

  # One PR for the example's minor and patch updates, not one per package.
  - package-ecosystem: uv
    directory: /examples/mcp-client-python
    schedule:
      interval: monthly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
