# The evaluation gate (ADR 0017): the golden cases through the real agents, graded and held to
# agent-platform/src/test/resources/eval/thresholds.json. Costs money, so it runs only when started by hand, with a
# budget the run cannot pass (it stops starting analyses first). Add a schedule here only with an agreed monthly budget.
name: eval

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: "Runs per case"
        default: "3"
      cases:
        description: "Comma-separated case ids (empty: all)"
        default: ""
      modes:
        description: "SINGLE, MULTI or SINGLE,MULTI"
        default: "SINGLE"
      max_cost_usd:
        description: "Budget for the whole evaluation, USD"
        default: "1.00"
      judge:
        description: "Also score reports with the LLM judge (about $0.003 per run)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  evaluate:
    # A named image, not ubuntu-latest: the next upgrade is a decision with a green run, not a surprise.
    # 26.04 ships Docker 29, which needs Testcontainers 2.0.2 or later (we use 2.0.5).
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Fetch the MAS documents for the knowledge base
        run: ./scripts/fetch-knowledge.sh
      # Inputs reach the shell as environment variables, never spliced into the script: a case id like
      # "x; curl ..." stays one argument.
      - name: Run the evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPEATS: ${{ inputs.repeats }}
          CASES: ${{ inputs.cases }}
          MODES: ${{ inputs.modes }}
          MAX_COST_USD: ${{ inputs.max_cost_usd }}
          JUDGE: ${{ inputs.judge }}
        run: >
          ./mvnw -B -ntp -pl agent-platform -am test
          -Dtest=GoldenEvalTest -Dsurefire.failIfNoSpecifiedTests=false
          -Deval=true
          "-Deval.repeats=$REPEATS"
          "-Deval.cases=$CASES"
          "-Deval.modes=$MODES"
          "-Deval.maxCostUsd=$MAX_COST_USD"
          "-Deval.judge=$JUDGE"
      - name: Keep the evaluation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-report
          path: agent-platform/target/eval/
