# Local environment, split into profiles so a 16 GB laptop only runs what the task needs.
#
#   docker compose -f deploy/docker-compose.yml --profile core up -d            # daily dev (~2 GB)
#   docker compose -f deploy/docker-compose.yml --profile core --profile systems up -d  # + fake bank systems
#   docker compose -f deploy/docker-compose.yml --profile core --profile stream up -d
#   docker compose -f deploy/docker-compose.yml --profile obs up -d
#   docker compose -f deploy/docker-compose.yml --profile kafka-ui up -d   # topics, messages, lag (with core)
#   docker compose -f deploy/docker-compose.yml --profile reranker up -d --build  # cross-encoder reranker, ADR 0030
#
# Flink runs inside the IDE (embedded MiniCluster) during development; the `stream` profile is
# for benchmarks and demos only.

name: finsentinel

services:

  # ---------- core ----------

  kafka:
    image: apache/kafka:4.3.1
    profiles: [core]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
    mem_limit: 1g

  # One-shot: topics are created explicitly (auto-create is off) so partition counts are deliberate.
  kafka-init:
    image: apache/kafka:4.3.1
    profiles: [core]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        create() { /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic "$$1" --partitions "$$2" --replication-factor 1; }
        create txn.transactions.v2 6
        create txn.transactions.dlq.v2 1
        create risk.alerts.v2 3
        create risk.alerts.v2.DLT 1
        create case.events.v1 3
        # Latest baseline per account (ADR 0019): compaction keeps one record per tenant|account key.
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic account.baselines.v1 --partitions 6 --replication-factor 1 --config cleanup.policy=compact
        echo "topics ready"
    restart: "no"

  # Schema registry (ADR 0018): Avro contracts of the v2 topics, Confluent-compatible API at /apis/ccompat/v7.
  # kafkasql storage keeps schemas in a Kafka topic, so they survive restarts without another database.
  # Schemas are registered on purpose: ./mvnw -pl contracts -am compile exec:java
  schema-registry:
    image: apicurio/apicurio-registry:3.3.3
    profiles: [core]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8095:8080"
    environment:
      APICURIO_STORAGE_KIND: kafkasql
      APICURIO_KAFKASQL_BOOTSTRAP_SERVERS: kafka:19092
      APICURIO_KAFKASQL_TOPIC_AUTO_CREATE: "true"
      JAVA_OPTS_APPEND: -Xms128m -Xmx384m
    mem_limit: 512m

  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    profiles: [core]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: finsentinel
      POSTGRES_USER: finsentinel
      POSTGRES_PASSWORD: finsentinel
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsentinel -d finsentinel"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m

  redis:
    image: redis:8.10-alpine
    profiles: [core]
    ports:
      - "6380:6379"  # 6379 is often taken by other local projects
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 320m

  # Identity provider: realm "finsentinel" (users, roles, tenant claim, MCP clients) imported from keycloak/.
  # Development mode, in-memory database: the realm is re-imported on every start. 8080 is taken by other projects.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    profiles: [core]
    ports:
      - "8094:8080"
    command: ["start-dev", "--import-realm", "--http-port=8080", "--hostname=http://localhost:8094"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx512m
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    mem_limit: 768m

  # ---------- systems: fake bank and vendor systems behind the MCP servers (see systems/README.md) ----------

  systems:
    image: wiremock/wiremock:3.13.2
    profiles: [systems]
    ports:
      - "8093:8080"
    volumes:
      - ./systems/mappings:/home/wiremock/mappings:ro
    mem_limit: 256m

  # ---------- stream (benchmarks / demos) ----------
  # Submit the job (after ./mvnw -pl stream-job package):
  #   docker exec finsentinel-flink-jobmanager-1 flink run -d /opt/finsentinel/stream-job-0.1.0-SNAPSHOT.jar \
  #     --kafka.bootstrap-servers=kafka:19092 --schema-registry.url=http://schema-registry:8080/apis/ccompat/v7
  # On a cluster the job leaves the REST port and checkpoint storage to the cluster's settings below (ADR 0026).
  # Checkpoints go to a volume both containers mount, so a TaskManager that comes back as a new container restores
  # from the same files.

  # The volume starts out owned by root; the image runs Flink as its flink user, so this hands it over once.
  flink-checkpoints-init:
    image: flink:2.2.1-java21
    profiles: [stream]
    user: root
    entrypoint: ["chown", "flink:flink", "/checkpoints"]
    volumes:
      - flink-checkpoints:/checkpoints

  flink-jobmanager:
    image: flink:2.2.1-java21
    profiles: [stream]
    depends_on:
      flink-checkpoints-init:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 768m
        execution.checkpointing.dir: file:///checkpoints
    volumes:
      - ../stream-job/target:/opt/finsentinel:ro
      - flink-checkpoints:/checkpoints
    mem_limit: 900m

  flink-taskmanager:
    image: flink:2.2.1-java21
    profiles: [stream]
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-checkpoints-init:
        condition: service_completed_successfully
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 1200m
        taskmanager.numberOfTaskSlots: 4
        execution.checkpointing.dir: file:///checkpoints
    volumes:
      - flink-checkpoints:/checkpoints
    mem_limit: 1400m

  # ---------- obs ----------

  # Grafana + Prometheus + Tempo + Loki + OTel collector in one container. Grafana on :3000.
  lgtm:
    image: grafana/otel-lgtm:0.38.1
    profiles: [obs]
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    # Our dashboards (phase 9, ADR 0024), provisioned at startup next to the image's own.
    volumes:
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/finsentinel.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/finsentinel-dashboards:ro
    mem_limit: 1200m

  # ---------- kafka-ui ----------

  # Topics, messages (Avro decoded through the registry), consumer groups and lag, for demos (ADR 0027). Read-only and
  # without sign-in: a local tool, like Grafana here. Its own profile so the obs profile stays light.
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    profiles: [kafka-ui]
    ports:
      - "8098:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: finsentinel
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8080/apis/ccompat/v7
      KAFKA_CLUSTERS_0_READONLY: "true"
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: -Xms128m -Xmx320m
    mem_limit: 512m

  # ---------- reranker ----------

  # Cross-encoder reranking of regulation passages (ADR 0030), used when finsentinel.knowledge.search.rerank.with is
  # cross-encoder. Built from reranker/ (base images pinned by digest there). The first start downloads the model
  # (about 2.3 GB) into the volume and is healthy only once it is loaded. Its own profile: it needs ~2.5 GB of memory.
  reranker:
    build: ../reranker
    image: finsentinel-reranker:0.1.0
    profiles: [reranker]
    ports:
      - "8099:8000"
    environment:
      RERANKER_DEVICE: cpu
    volumes:
      - reranker-models:/models
    mem_limit: 3g

volumes:
  kafka-data:
  pg-data:
  flink-checkpoints:
  reranker-models:
