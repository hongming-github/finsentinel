# Spark and Hadoop log a great deal at INFO; keep the job's own summary readable.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %-5p %c{1} - %m%n
logger.batch.name = com.finsentinel.batch
logger.batch.level = info
# No native Hadoop libraries on a laptop; the pure-Java code paths are used, which is fine here.
logger.nativecode.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativecode.level = error
