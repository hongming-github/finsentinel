# Defaults for the daily baseline job (ADR 0019).
# Override any key with --key=value, e.g.
#   ./mvnw -pl batch-job exec:exec -Djob.args="--as-of=2026-10-10 --baseline.window-days=30"
# FINSENTINEL_LAKE_DIR, KAFKA_BOOTSTRAP_SERVERS and SCHEMA_REGISTRY_URL in the environment override the matching keys.

# Same root as the stream job's lake.dir: it writes landing/, this job writes curated/, quarantine/ and gold/.
lake.dir=/tmp/finsentinel/lake
# The UTC date the run is for: baselines cover complete days before it. Empty = today (UTC).
as-of=
# Landing days re-curated on every run (ending the day before as-of), so late events within this many days are
# picked up. Curation overwrites only the days it writes, so re-runs are idempotent.
curate.lookback-days=3
# History a baseline covers, in days before as-of.
baseline.window-days=90

kafka.bootstrap-servers=localhost:9092
schema-registry.url=http://localhost:8095/apis/ccompat/v7
schema-registry.timeout=10s
# false = compute and write Parquet only, no Kafka (dry runs).
publish.enabled=true

# Local mode for development; leave empty under spark-submit, which sets the master.
spark.master=local[*]
