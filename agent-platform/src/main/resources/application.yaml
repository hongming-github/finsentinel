server:
  port: 8090

spring:
  application:
    name: agent-platform
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/finsentinel
    username: finsentinel
    password: finsentinel
  ai:
    openai:
      # Empty when unset: the client starts in no-auth mode, so tests and builds work without a key.
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: gpt-5.4-mini
        # Chat Completions (which Spring AI 2.0 uses) rejects function tools combined with reasoning on
        # gpt-5.4-mini; that combination needs the Responses API. The agent's work is tool-driven lookups,
        # so non-reasoning mode is the better latency/cost trade anyway.
        reasoning-effort: none
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest

finsentinel:
  investigation:
    enabled: true
    batch-size: 2
    poll-interval: 5s
    claim-timeout: 5m
    max-attempts: 3
    max-per-hour: 60
    tools:
      max-days: 90
      max-transactions: 100
    report:
      fraud-min-score: 60
      legitimate-max-score: 40
      max-repairs: 1
  alerts:
    max-page-size: 200
    retry-interval: 1s
    retry-attempts: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    org.apache.kafka: warn
