server:
  port: 8090

spring:
  application:
    name: agent-platform
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/finsentinel
    # The platform's login is subject to row-level security (V10, ADR 0015); it is never the schema owner.
    username: finsentinel_app
    password: ${FINSENTINEL_APP_DB_PASSWORD:finsentinel_app}
  flyway:
    # Migrations run as the schema owner on a connection of their own; V10 creates the app login with this password.
    url: ${spring.datasource.url}
    user: finsentinel
    password: ${FINSENTINEL_OWNER_DB_PASSWORD:finsentinel}
    placeholders:
      app_password: ${spring.datasource.password}
  ai:
    openai:
      # Empty when unset: the client starts in no-auth mode, so tests and builds work without a key.
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: gpt-6-luna
        # Chat Completions (which Spring AI 2.0 uses) takes function tools only without reasoning (gpt-5.4-mini
        # rejected the combination; gpt-6-luna documents tools on Chat Completions with reasoning effort none only).
        # The agent's work is tool-driven lookups, so non-reasoning mode is the better latency/cost trade anyway.
        reasoning-effort: none
      embedding:
        model: text-embedding-3-small
    # Traces (ADR 0020) carry model names, token counts and cost, never case material: prompts, answers and tool
    # arguments stay out of spans whatever the library defaults become (ObservabilityPropertiesTest guards this).
    chat:
      observations:
        log-prompt: false
        log-completion: false
      client:
        observations:
          log-prompt: false
          log-completion: false
    tools:
      observations:
        include-content: false
    mcp:
      server:
        name: finsentinel-platform
        version: 0.1.0
        # Read-only lookups: any instance answers any request. Endpoint: /mcp on the platform port.
        protocol: STATELESS
        instructions: Fraud cases of FinSentinel's banks and the MAS regulatory knowledge base, read-only.
  security:
    oauth2:
      # Keycloak realm "finsentinel" (deploy/keycloak). Tokens must be issued by it, for this platform (audience).
      # The decoder fetches the realm's keys on first use: the platform starts while Keycloak is still starting.
      resourceserver:
        jwt:
          issuer-uri: ${FINSENTINEL_ISSUER:http://localhost:8094/realms/finsentinel}
          audiences: [finsentinel-platform]
      # The platform's own identity towards mcp-banking and mcp-compliance. token-uri rather than issuer-uri: an
      # issuer would be contacted at startup, and the platform must start while the identity provider is down.
      client:
        registration:
          platform-service:
            provider: finsentinel
            client-id: platform-service
            client-secret: ${PLATFORM_SERVICE_SECRET:platform-service-dev-secret}
            authorization-grant-type: client_credentials
        provider:
          finsentinel:
            token-uri: ${FINSENTINEL_ISSUER:http://localhost:8094/realms/finsentinel}/protocol/openid-connect/token
  data:
    redis:
      host: localhost
      port: 6380
      # The search cache is disposable: an unreachable Redis must cost a search milliseconds, not seconds.
      connect-timeout: 250ms
      timeout: 250ms
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      # The platform consumes Avro (ADR 0018) and decodes it itself, so unreadable bytes reach the dead-letter topic.
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    producer:
      # Bytes in, bytes out: the outbox sends JSON it has serialised, dead-letter records keep the bytes that arrived.
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
    listener:
      # A consumer span per message, continuing the producer's trace from the traceparent header (ADR 0020).
      observation-enabled: true

finsentinel:
  investigation:
    enabled: true
    batch-size: 2
    poll-interval: 5s
    # A running analysis renews its claim every heartbeat; one not renewed for the lease (its instance died) is taken
    # over, one held longer than the timeout (stuck) too. claimed_at stays the fencing token (ADR 0026, drill 10).
    claim-timeout: 5m
    claim-lease: 30s
    claim-heartbeat: 10s
    max-attempts: 3
    # Between failed attempts (ADR 0026): 1 min, then 2 min, so three attempts outlast a model outage of 3 minutes.
    retry:
      pause: 1m
      multiplier: 2
      max-pause: 10m
    max-per-hour: 60
    # Claims hold the lock for milliseconds; waiting longer than this means something is stuck.
    claim-lock-timeout: 2s
    tools:
      max-days: 90
      max-transactions: 100
      # Lower bound on travel between countries (ADR 0021); keep equal to rules.geo-jump.max-speed-kmh (stream job).
      travel-max-speed-kmh: 1000
    report:
      fraud-min-score: 60
      legitimate-max-score: 40
      max-repairs: 1
      require-regulations-for-transfers: true
  llm:
    # OpenAI-compatible providers. openai is spring.ai.openai.*; a provider without an API key is unavailable.
    providers:
      openai:
        structured-output-with-tools: true
      groq:
        base-url: https://api.groq.com/openai/v1
        api-key: ${GROQ_API_KEY:}
        # Groq enforces a JSON Schema only in requests without tools: tool-using agents get the format in the prompt
        # and the report validator checks the result.
        structured-output-with-tools: false
        # Groq's strict schema allows "format" only on strings; Spring AI writes "format": "int32" on integers.
        schema-formats-on-non-strings: false
        # gpt-oss returns its reasoning; Spring AI 2.0.1 echoes it back as reasoning_content in tool-call turns and
        # Groq rejects that field (400). Without reasoning in the response there is nothing to echo.
        extra-body:
          include_reasoning: false
    # The model of each agent role on an ordinary case. "provider:model"; a bare name is OpenAI.
    models:
      # gpt-6-luna since 2026-10-15 (ADR 0023): 51/51 golden runs against gpt-5.4-mini's 44/48, at a ninth of the cost.
      investigator: gpt-6-luna
      specialist: gpt-6-luna
      writer: gpt-6-luna
      reviewer: gpt-6-luna
    # Escalated cases (a transfer, or an alert of these severities) switch these roles to the stronger model.
    # Off by default: on the live scenarios it cost 5.3x per case with no accuracy gain (ADR 0011). To turn on:
    # roles: [investigator, writer]
    escalation:
      model: gpt-5.5
      roles: []
      on-transfer: true
      on-severity: [HIGH]
    # When a model's provider fails (error status, rate limit, out of credit, network) or its circuit is open, the call
    # goes here. The circuit opens after failure-threshold consecutive failures, for open-for, then one call tries.
    fallback:
      model: groq:openai/gpt-oss-120b
      failure-threshold: 3
      open-for: 60s
    # USD per million tokens. OpenAI: standard tier, short context (<= 272K input tokens; our prompts are a few
    # thousand), developers.openai.com/api/docs/pricing, checked 2026-10-15; Groq: console.groq.com/docs/models, checked
    # 2026-10-03 (no cached rate listed, so input is assumed). cache-write only where the provider charges for writes
    # (OpenAI from GPT-5.6 on); without it writes cost the input rate. Keys with dots, colons or slashes need brackets.
    prices:
      "[gpt-6-luna]": { input: 0.10, cached-input: 0.01, cache-write: 0.125, output: 0.50 }
      "[gpt-5.5]": { input: 5.00, cached-input: 0.50, output: 30.00 }
      "[gpt-5.4-mini]": { input: 0.75, cached-input: 0.075, output: 4.50 }
      "[gpt-5.4-nano]": { input: 0.20, cached-input: 0.02, output: 1.25 }
      "[groq:openai/gpt-oss-120b]": { input: 0.15, cached-input: 0.15, output: 0.60 }
      "[groq:openai/gpt-oss-20b]": { input: 0.075, cached-input: 0.075, output: 0.30 }
  usage:
    max-days: 90
  privacy:
    # HMAC key for the pseudonyms that replace phone numbers, emails, NRIC and card numbers in model prompts (ADR 0015).
    pseudonym-key: ${FINSENTINEL_PSEUDONYM_KEY:dev-only-pseudonym-key-change-me}
  analysis:
    # SINGLE: one investigator with every tool. MULTI: plan, parallel specialists, report writer. SINGLE measured as
    # accurate and cheaper/faster on the live scenarios (ADR 0010).
    mode: SINGLE
    # Times the reviewer may send a report back per run. Worst case model calls per analysis:
    # SINGLE: (1 + max-repairs) * (1 + max-revisions) + (1 + max-revisions)
    # MULTI:  3 specialists + (1 + max-repairs) * (1 + max-revisions) + (1 + max-revisions)
    max-revisions: 1
    # Risk-based review: reports that clear or defer a case are reviewed; LIKELY_FRAUD reports go to the analyst as
    # they are. The reviewer's real catches were on clearing reports, its immaterial objections mostly on fraud
    # reports, and every case is decided by an analyst anyway.
    review-dispositions: [LIKELY_LEGITIMATE, NEEDS_REVIEW]
  knowledge:
    # Relative to the working directory; README runs the platform from the repository root.
    dir: knowledge
    sync-on-startup: true
    max-chunks: 5000
    chunk-chars: 2400
    min-font-pt: 10
    batch-size: 100
    search:
      candidates: 20
      # Passages handed to the agent per search. Five full passages diluted the case evidence enough to flip
      # an impossible-travel case to "legitimate"; three trimmed ones did not.
      top-k: 3
      rrf-k: 60
      max-searches-per-case: 3
      agent-passage-chars: 900
      rerank:
        enabled: true
        # gpt-6-luna since 2026-10-15 (ADR 0023): same hit@5, better MRR than gpt-5.4-nano, which shuts down 2027-04-01.
        model: gpt-6-luna
        max-passage-chars: 700
      # Exact question match only (normalised case and spacing). A semantic (embedding similarity) cache was measured
      # and rejected: one-word-apart questions with different answers score 0.95 cosine (ADR 0013).
      cache:
        enabled: true
        ttl: 7d
  systems:
    # MCP servers (mcp-banking, mcp-compliance). Connected on first use; when one is down, agents carry on without it.
    banking-url: http://localhost:8091
    compliance-url: http://localhost:8092
    connect-timeout: 2s
    request-timeout: 8s
    # Per system, as for model providers: after failure-threshold failed calls in a row its calls fail at once for
    # open-for, then one call tries. A slow system otherwise costs every call its full timeout (ADR 0026, drill 05).
    circuit:
      failure-threshold: 3
      open-for: 30s
    # Outside systems each bank has connected (BANKING: CRM and core banking; COMPLIANCE: watchlist screening). Agents
    # get only the tools of their bank's systems, and the brief says which checks are not available.
    connected-default: [BANKING, COMPLIANCE]
    connected:
      # Example of a bank without a screening vendor contract: its payees are never sent to mcp-compliance.
      harbour: [BANKING]
  mcp-server:
    # External callers pay for embeddings and reranking with every search: a budget of its own, across instances.
    max-regulation-searches-per-hour: 200
    max-cases: 50
    max-passages: 10
  outbox:
    enabled: true
    poll-interval: 1s
    batch-size: 100
    send-timeout: 5s
  schema-registry:
    url: http://localhost:8095/apis/ccompat/v7
    timeout: 5s
  alerts:
    max-page-size: 200
    # A failing record is retried until it succeeds (only unreadable ones are dead-lettered, ADR 0018, 0026):
    # 1 s, 2 s, 4 s ... then every 10 s, so it goes through within 10 s of an outage ending.
    retry-interval: 1s
    retry-multiplier: 2
    retry-max-interval: 10s

management:
  tracing:
    sampling:
      # Parent-based: a trace started upstream (a transaction) keeps the upstream decision; this rate applies to
      # traces that start here (analyst requests). All of them in development; lower it in production.
      probability: 1.0
  # Traces are exported only when an OTLP endpoint is set, e.g.
  #   --management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
  otlp:
    metrics:
      export:
        # Off by default: with no collector running it would log a failed push every minute. To send metrics to
        # the obs profile: --management.otlp.metrics.export.enabled=true
        #                  --management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
        enabled: false
  metrics:
    distribution:
      # Micrometer's histograms stop at 30 s by default, so a payment-to-report time of three minutes read as 30 s in
      # the chaos drills (phase 9C). A slow provider or a backed-up queue takes minutes.
      maximum-expected-value:
        finsentinel.pipeline: 15m
        finsentinel.llm.ask: 5m
      # The gateway's observation has no histogram otherwise: no per-model p95 on the dashboard.
      percentiles-histogram:
        finsentinel.llm.ask: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    # Redis holds only the search cache; the platform works without it, so it must not turn health DOWN.
    redis:
      enabled: false

logging:
  level:
    org.apache.kafka: warn
    # Lettuce's resolver looks for a macOS-native DNS library and logs an ERROR when it is absent; the JDK fallback it
    # then uses is fine (and production runs on Linux).
    io.netty.resolver.dns.DnsServerAddressStreamProviders: off
