# Defaults for the risk detection job.
# Override any key on the command line with --key=value, e.g.
#   flink run stream-job.jar --rules.velocity.threshold=10
#   ./mvnw -pl stream-job exec:exec -Djob.args="--rules.velocity.threshold=10"
# KAFKA_BOOTSTRAP_SERVERS, SCHEMA_REGISTRY_URL and FINSENTINEL_LAKE_DIR in the environment override the matching keys.
# Durations accept 500ms, 60s, 5m, 2h, 30d or ISO-8601 (PT60S).

kafka.bootstrap-servers=localhost:9092
kafka.group-id=finsentinel-stream
# Confluent-compatible schema registry API (Apicurio's ccompat). The job's schemas must be registered there first.
schema-registry.url=http://localhost:8095/apis/ccompat/v7
schema-registry.timeout=10s
checkpoint.interval=10s
local.web-ui-port=8082
# Data lake root shared with batch-job (ADR 0019): the job writes landing/transactions/dt=YYYY-MM-DD/*.jsonl.
# A local path or any Flink file system URI.
lake.dir=/tmp/finsentinel/lake
# Accounts idle longer than this lose their baseline; bounds state size.
state.ttl=30d

# Velocity: this many transactions inside the window raise one alert per window.
rules.velocity.window=60s
rules.velocity.threshold=8

# Large amount: judged against the account's own history once it has enough of it.
rules.large-amount.min-history=10
rules.large-amount.std-devs=6.0
rules.large-amount.mean-multiple=5.0
# Until an account has min-history streaming transactions, its batch baseline (ADR 0019) stands in, if it is no
# older than this (measured from the transaction's event time).
rules.large-amount.baseline-max-age=3d
# Always alert at or above this amount, history or not.
rules.large-amount.hard-limit=50000

# Geo jump: card-present payments in two countries closer together than this.
rules.geo-jump.window=2h
