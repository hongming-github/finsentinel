# Defaults for the risk detection job.
# Override any key on the command line with --key=value, e.g.
#   flink run stream-job.jar --rules.velocity.threshold=10
#   ./mvnw -pl stream-job exec:exec -Djob.args="--rules.velocity.threshold=10"
# KAFKA_BOOTSTRAP_SERVERS, SCHEMA_REGISTRY_URL, FINSENTINEL_LAKE_DIR and OTEL_EXPORTER_OTLP_ENDPOINT in the environment
# override the matching keys.
# Durations accept 500ms, 60s, 5m, 2h, 30d or ISO-8601 (PT60S).

kafka.bootstrap-servers=localhost:9092
kafka.group-id=finsentinel-stream
# Confluent-compatible schema registry API (Apicurio's ccompat). The job's schemas must be registered there first.
schema-registry.url=http://localhost:8095/apis/ccompat/v7
schema-registry.timeout=10s
checkpoint.interval=10s
# Where checkpoints are written (a local path or any Flink file system URI; ${user.home} is expanded). Without it Flink
# keeps them in the JobManager's memory, which allows 5 MB of state per subtask: about 200,000 accounts made every
# checkpoint fail and the job restart in a loop (ADR 0025). A cluster sets its own (e.g. s3://...).
checkpoint.dir=${user.home}/.finsentinel/checkpoints
# Embedded mode only (scripts/stack.sh flink): start from the newest complete checkpoint under checkpoint.dir (latest),
# so a restart keeps the rules' state, or from nothing (none). The job keeps its last checkpoint when it stops. On a
# cluster this and the two keys around it are the cluster's: the JobManager restores after a failure, a redeployment
# passes a savepoint (flink run -s), and checkpoints go where the cluster's execution.checkpointing.dir says.
checkpoint.restore=latest
local.web-ui-port=8082
# Data lake root shared with batch-job (ADR 0019): the job writes landing/transactions/dt=YYYY-MM-DD/*.jsonl.
# A local path or any Flink file system URI; ${user.home} is expanded. Not under /tmp: landing is the only raw copy of
# the history, and macOS deletes files in /tmp that have not been accessed for 3 days.
lake.dir=${user.home}/.finsentinel/lake
# OTLP/HTTP receiver for one span per alert (ADR 0020), e.g. http://localhost:4318. Empty = no spans; alerts still
# carry the triggering transaction's trace context, so the platform continues that trace.
tracing.otlp-endpoint=
# Accounts idle longer than this lose their baseline; bounds state size.
state.ttl=30d

# Velocity: this many transactions inside the window raise one alert per window.
rules.velocity.window=60s
rules.velocity.threshold=8

# Large amount: judged against the account's own history once it has enough of it.
rules.large-amount.min-history=10
rules.large-amount.std-devs=6.0
rules.large-amount.mean-multiple=5.0
# Until an account has min-history streaming transactions, its batch baseline (ADR 0019) stands in, if it is no
# older than this (measured from the transaction's event time).
rules.large-amount.baseline-max-age=3d
# Always alert at or above this amount, history or not.
rules.large-amount.hard-limit=50000

# Geo jump: card-present payments in two countries sooner than any flight between them allows (common
# TravelFeasibility: nearest airports, no time on the ground, at this speed). Keep the speed above real airliner
# ground speeds (the record New York-London crossing averaged about 1,120 km/h gate to gate; payments add boarding
# and landing time on top): too low a speed calls real trips impossible. Same value as finsentinel.travel in the
# platform's application.yaml.
rules.geo-jump.max-speed-kmh=1000
# For a country without flight data, the rule falls back to a plain window: two countries closer together than this.
rules.geo-jump.fallback-window=2h
