# Settings of the load tests (ADR 0025). Override any key with -Dkey=value on the Maven command line, e.g.
#   ./mvnw -pl load-test gatling:test -Dgatling.simulationClass=com.finsentinel.loadtest.AnalystApiSimulation \
#     -Danalyst.users-per-second=20
# Durations: 30s, 2m.

platform.url=http://localhost:8090
token.url=http://localhost:8094/realms/finsentinel/protocol/openid-connect/token
# Realm tokens live 5 minutes; a token is fetched again this long before it expires.
token.refresh-margin=30s

# AnalystApiSimulation: each virtual user is one analyst visit (queue, one case, sometimes a decision). Open model:
# visits arrive at this rate whether or not the platform keeps up, as analysts would.
analyst.users-per-second=10
analyst.ramp=20s
analyst.hold=2m
# Share of visits that end in a decision (FALSE_POSITIVE with If-Match). A decision closes the case, so the queue of
# cases awaiting decision must be refilled for long runs (an alert burst).
analyst.decide-share=0.2
# Pass/fail of the run: p95 of all requests and the share of failed ones (409 on a decision is not a failure).
analyst.max-p95=500ms
analyst.max-failed-percent=1

# McpSimulation: an assistant reading cases over /mcp, and a searcher spending the regulation-search budget.
mcp.users-per-second=10
mcp.ramp=20s
mcp.hold=2m
mcp.max-p95=500ms
mcp.max-failed-percent=1
# Searches per second and for how long; set above finsentinel.mcp-server.max-regulation-searches-per-hour to see
# the budget hold. Must equal the platform's setting for the assertion on answered searches.
mcp.searches-per-second=5
mcp.search-duration=1m
mcp.search-budget=200
